# Choose the profile used when a tool omits the `connection` argument.
default = "dev"

[connections.dev]
description = "Local development"
host = "127.0.0.1"
port = 3306
user = "readonly_user"
password_env = "MYSQL_DEV_PASSWORD"
database = "app_dev"
allowed_databases = ["app_dev", "analytics_dev"]
query_timeout_ms = 30000
max_rows = 500
max_cell_length = 20000
# UTF-8 query response text budget (not DB scan/memory limit).
max_response_bytes = 262144
# Effective concurrency is also capped by pool_size when pooling is enabled.
max_concurrent_queries = 5
max_queued_queries = 16
queue_timeout_ms = 1000
# csv (legacy), json (typed), or compact (JSON metadata + CSV).
result_format = "json"
mask_columns = ["password", "*password*", "*passwd*", "*pwd*", "*secret*", "token", "*token", "*_token", "token_*", "*tokenvalue*", "*accesstoken*", "*refreshtoken*", "*idtoken*", "*appsec*", "*api_key*", "*private_key*", "*ssn*", "*id_card*", "*phone*", "*mobile*", "*email*"]
pool_size = 3
audit_enabled = true
audit_log_file = "C:/var/log/mysql-mcp/dev-audit.jsonl"
audit_log_max_bytes = 10000000
audit_log_backup_count = 10
# Optional signing key is loaded from the environment, never this file.
# audit_hmac_key_env = "MYSQL_MCP_AUDIT_SIGNING_KEY"
# audit_required_context = ["actor", "purpose", "ticket_id"]
# audit_fail_closed = true
# audit_fsync = true

[connections.test]
description = "Shared test environment"
host = "test-db.example.internal"
port = 3306
user = "readonly_user"
password_env = "MYSQL_TEST_PASSWORD"
database = "app_test"
allowed_databases = ["app_test"]
ssl_mode = "VERIFY_CA"
ssl_ca = "C:/path/to/ca.pem"

[connections.prod]
description = "Production read replica through SSH"
host = "mysql.internal"
port = 3306
user = "readonly_user"
password_env = "MYSQL_PROD_PASSWORD"
database = "app"
allowed_databases = ["app", "reporting"]
# Unrecognized stored functions/UDFs are blocked. Add only reviewed,
# deterministic functions that cannot write or cause external side effects.
allowed_functions = []
query_timeout_ms = 15000
max_rows = 200
result_format = "json"
mask_columns = ["password", "*password*", "*passwd*", "*pwd*", "*secret*", "token", "*token", "*_token", "token_*", "*tokenvalue*", "*accesstoken*", "*refreshtoken*", "*idtoken*", "*appsec*", "*api_key*", "*private_key*", "*ssn*", "*id_card*", "*phone*", "*mobile*", "*email*"]
pool_size = 5
audit_enabled = true
audit_log_file = "C:/var/log/mysql-mcp/prod-audit.jsonl"
audit_hmac_key_env = "MYSQL_MCP_AUDIT_SIGNING_KEY"
audit_required_context = ["actor", "purpose", "ticket_id"]
audit_fail_closed = true
audit_fsync = true

[connections.prod.ssh]
enabled = true
host = "bastion.example.com"
port = 22
user = "developer"
key_path = "C:/Users/you/.ssh/id_ed25519"
remote_host = "mysql.internal"
remote_port = 3306
# 0 selects a free local port. The process is reused and automatically restarted.
local_port = 0
startup_timeout = 5

# Password-free MCP configuration on Windows/macOS/Linux desktop keyrings:
# [connections.secure-dev]
# host = "127.0.0.1"
# user = "readonly_user"
# credential_provider = "keyring"
# credential_ref = "secure-dev"
# database = "app_dev"
# allowed_databases = ["app_dev"]
# Then store the password interactively (it is never printed):
# readonly-db-mcp credentials --profiles-file C:/path/mysql-connections.toml set secure-dev

# Explicit logical environment routing. Only exact aliases below are routed;
# the server never guesses a target from similar connection or database names.
# [routes.shared-test]
# ubp = { connection = "test-ubp", database = "ubp" }
# gts = { connection = "test-gts", database = "gts" }
# eam = { connection = "test-eam", database = "eam" }
