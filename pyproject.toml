[project]
name = "mysql_mcp_server"
version = "0.7.2"
description = "A strictly read-only Model Context Protocol (MCP) server for safely exploring multiple MySQL environments and databases."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "mysql", "database", "ai", "llm", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "mysql-connector-python>=9.2.0,<10.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sqlglot>=26.0.0,<31.0.0",
]

[project.optional-dependencies]
sse = [
    "starlette>=0.35.0",
    "uvicorn>=0.27.0",
]

[[project.authors]]
name = "Dana K. Williams"

[[project.maintainers]]
name = "Dana K. Williams"
email = "dana_w@designcomputer.com"

[project.urls]
Homepage = "https://github.com/12zhangyan/mysql_mcp_server"
Repository = "https://github.com/12zhangyan/mysql_mcp_server"
Issues = "https://github.com/12zhangyan/mysql_mcp_server/issues"
Changelog = "https://github.com/12zhangyan/mysql_mcp_server/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mysql_mcp_server = "mysql_mcp_server:main"
